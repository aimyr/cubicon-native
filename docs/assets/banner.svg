<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Cubicon Native</title>
  <desc id="desc">Native Mac slicing, from model to G-code.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172b3a"/></linearGradient>
    <linearGradient id="top" x2="1" y2="1"><stop stop-color="#a1ffff"/><stop offset="1" stop-color="#35ced6"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6ce3e9" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1400" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="24" fill="url(#grid)"/>
  <g transform="translate(110 86)" stroke="#0a1724" stroke-width="5" stroke-linejoin="round">
    <path d="M120 0 240 69 120 138 0 69Z" fill="url(#top)"/>
    <path d="M0 69 120 138 120 277 0 208Z" fill="#3184db"/>
    <path d="M120 138 240 69 240 208 120 277Z" fill="#20acbc"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="430" y="141" fill="#77e6ec" font-size="16" font-weight="600" letter-spacing="4">BUILT FOR APPLE SILICON</text>
    <text x="426" y="217" fill="#f1f7fb" font-size="69" font-weight="700" letter-spacing="-2">Cubicon Native</text>
    <text x="431" y="266" fill="#b0c4d3" font-size="26">A native Mac workflow for your Cubicon printer.</text>
    <g fill="#d4e6ee" font-size="17"><text x="432" y="330">IMPORT</text><text x="551" y="330" fill="#4bcbd4">→</text><text x="602" y="330">ARRANGE</text><text x="742" y="330" fill="#4bcbd4">→</text><text x="792" y="330">SLICE</text><text x="895" y="330" fill="#4bcbd4">→</text><text x="944" y="330">EXPORT</text></g>
  </g>
</svg>
